name: Python source validation

on:
  push:
    branches: [main, "ui/**", "feature/**", "audit/**"]
  workflow_dispatch:

jobs:
  syntax-and-unit-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for media smoke tests
        run: choco install ffmpeg --yes --no-progress
      - name: Compile all Python source and tests
        run: python -m py_compile app.py remote_server.py scene_engine.py story_engine.py ollama_client.py tests/test_scene_engine.py tests/test_story_engine.py tests/test_ffmpeg_smoke.py tests/test_remote_server.py
      - name: Run scene and FFmpeg integration tests
        run: python -m unittest discover -s tests -v
      - name: Check desktop UI runtime
        run: python -c "import tkinter; print('Tkinter runtime available')"
