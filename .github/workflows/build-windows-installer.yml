name: Build Windows desktop installer

on:
  workflow_dispatch:
  push:
    branches: [main, "audit/**"]
    paths:
      - "app.py"
      - "docs/INSTALACION_WINDOWS.md"
      - "remote_server.py"
      - "requirements.txt"
      - "scene_engine.py"
      - "story_engine.py"
      - "ollama_client.py"
      - "tests/**"
      - "build_windows.bat"
      - "installer/MARC-Video-Studio.iss"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg for media integration tests
        run: choco install ffmpeg --yes --no-progress

      - name: Validate source and tests
        shell: pwsh
        run: |
          python -m py_compile app.py remote_server.py scene_engine.py story_engine.py ollama_client.py tests/test_scene_engine.py tests/test_story_engine.py tests/test_ffmpeg_smoke.py tests/test_remote_server.py tests/test_app_startup.py
          python -m unittest discover -s tests -v

      - name: Install application dependencies
        run: python -m pip install --upgrade Pillow python-vlc

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --hidden-import vlc --name "MARC Video Studio AI Desktop" app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found after installing Inno Setup." }
          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null
          & $compiler "$PWD\installer\MARC-Video-Studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload Windows installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: MARC-Video-Studio-Windows
          path: |
            dist-installer/MARC-Video-Studio-Setup-*-x64.exe
            dist/MARC Video Studio AI Desktop/**
          if-no-files-found: error
          retention-days: 14
